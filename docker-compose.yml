version: '3.8'

services:
  # -------------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: coalsetu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coalgov_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Redis Queue & Cache Service
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coalsetu-redis
    restart: always
    ports:
      - '6379:6379'

  # -------------------------------------------------------------------
  # n8n Workflow Automation Service (Self-Hosted Air-Gapped Engine)
  # Orchestrates: Daily scheduled statutory reports, email alerts, webhooks
  # -------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: coalsetu-n8n
    restart: always
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      - postgres
      - redis

  # -------------------------------------------------------------------
  # Node.js Express Backend Service
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: coalsetu-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/coalgov_db?schema=public
      - JWT_ACCESS_SECRET=coalgov_super_secret_access_token_key_2026
      - ML_SERVICE_URL=http://ml_service:8001
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------
  # Python FastAPI ML & OCR Service
  # -------------------------------------------------------------------
  ml_service:
    build:
      context: ./ML
      dockerfile: Dockerfile
    container_name: coalsetu-ml-service
    restart: always
    ports:
      - '8001:8001'
    environment:
      - PORT=8001
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_MODEL=gemma3:1b
    volumes:
      - ml_cache:/app/cache

volumes:
  pgdata:
  n8ndata:
  ml_cache:
